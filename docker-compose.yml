name: engineering-knowledge-rag

x-app: &app
  build: .
  image: engineering-knowledge-rag:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
  volumes:
    - ./data:/app/data
    - ./docs:/app/docs:ro
  depends_on:
    qdrant:
      condition: service_healthy

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships without curl: check the port via /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    environment:
      QDRANT_URL: http://qdrant:6333
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    restart: unless-stopped

  ingest:
    <<: *app
    profiles: ["tools"]
    command: ["python", "main.py", "ingest", "--rebuild"]
    healthcheck:
      disable: true

  eval:
    <<: *app
    profiles: ["tools"]
    command: ["python", "main.py", "eval"]
    healthcheck:
      disable: true

  tests:
    <<: *app
    profiles: ["tools"]
    command: ["pytest", "-q"]
    depends_on: !reset []
    environment:
      QDRANT_URL: ":memory:"
      RERANKER_ENABLED: "false"
    healthcheck:
      disable: true

volumes:
  qdrant_storage:
